[workspace]
resolver = "3"
members = ["crates/onday", "crates/onday_mcp"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://gitlab.com/rymskip/onday"

[workspace.dependencies]
onday = { path = "crates/onday", version = "0.2.0" }
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
rmcp = { version = "3.3.0", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thirtyfour = { version = "0.37.5", features = ["bidi"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
