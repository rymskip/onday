<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialog</title>
  <style>
    body { margin: 0; }
    /* A fixed dialog that scrolls its own content, the way a modal form does,
       reaching nearly to the bottom of the window. */
    #dialog { position: fixed; top: 40px; bottom: 20px; left: 40px; width: 420px; overflow: auto; border: 1px solid #999; }
    #dialog-spacer { height: 2000px; }
    #dialog-field { position: relative; margin: 16px; }
    #dialog-input { width: 300px; height: 48px; padding-top: 16px; box-sizing: border-box; }
    /* A floating label drawn over its own input. */
    #dialog-label { position: absolute; left: 10px; top: 14px; }
  </style>
</head>
<body>
  <div id="dialog">
    <div id="dialog-spacer"></div>
    <div id="dialog-field">
      <input id="dialog-input">
      <label id="dialog-label" for="dialog-input">Social Security Number</label>
    </div>
  </div>
  <script>window.__appReady = true;</script>
</body>
</html>
