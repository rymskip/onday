name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the channel and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  browsers:
    name: browser suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner image ships Chrome and Firefox; onday resolves their drivers.
      - name: Point the suite at the runner's browsers
        run: |
          chrome="$(command -v google-chrome)"
          firefox="$(command -v firefox)"
          echo "ONDAY_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          echo "ONDAY_FIREFOX_EXECUTABLE=$firefox" >> "$GITHUB_ENV"
      - run: cargo test -p onday --test browser -- --ignored
