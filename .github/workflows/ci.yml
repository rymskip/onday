name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the channel and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  browsers:
    name: browser suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner image ships Chrome and Firefox; onday resolves their drivers.
      - name: Point the suite at the runner's browsers
        run: |
          chrome="$(command -v google-chrome)"
          firefox="$(command -v firefox)"
          echo "ONDAY_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          echo "ONDAY_FIREFOX_EXECUTABLE=$firefox" >> "$GITHUB_ENV"
      - run: cargo test -p onday --test browser -- --ignored

  publish:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, browsers]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      # Trusted publishing trades this job's OIDC token for a short-lived
      # crates.io token, so no registry secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - name: The tag names the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Each crate is published only when crates.io lacks this version, so a
      # rerun after a partial publish finishes it. onday_mcp depends on onday,
      # and cargo waits for onday to reach the index before going on.
      - name: Publish what crates.io does not have yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in onday onday_mcp; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'onday-release (https://github.com/rymskip/onday)' \
              "https://crates.io/api/v1/crates/$crate/$version")"
            case "$status" in
              200) echo "$crate $version is already on crates.io" ;;
              404) cargo publish -p "$crate" --locked ;;
              *) echo "crates.io answered $status for $crate $version" >&2; exit 1 ;;
            esac
          done
